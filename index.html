<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สูตรกาแฟ by เตี่ย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1a1a22;--mu:#6b6b78;--bd:#e4e3ec;--pk:#fff1f2;--pkb:#fecdd3;--rd:#e11d48;--bl:#3b82f6;--ac:#111;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141a;--card:#1e1e27;--tx:#ececf3;--mu:#9a9aab;--bd:#33333f;--pk:#2a1a20;--pkb:#5b2433;--ac:#fff;--acx:#111}}
:root[data-theme="dark"]{--bg:#14141a;--card:#1e1e27;--tx:#ececf3;--mu:#9a9aab;--bd:#33333f;--pk:#2a1a20;--pkb:#5b2433;--ac:#fff;--acx:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 'Noto Sans Thai',system-ui,sans-serif}
h1{font-size:22px;margin:0}h4{margin:14px 0 6px;font-size:13px;color:var(--mu)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 14px;display:inline-block}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.dg{color:var(--rd)}
button:focus-visible,.btn:focus-within,textarea:focus-visible,input:focus-visible{outline:2px solid var(--bl)}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:16px;max-width:1200px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding:0 16px 40px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;color:var(--mu);flex-wrap:wrap}
.pill{background:var(--pk);color:var(--rd);border-radius:999px;padding:2px 12px;font-weight:600}
.form{display:flex;background:var(--pk);border:1px solid var(--pkb);border-radius:12px;padding:10px;gap:10px;align-items:center;min-height:130px}
.rows{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:6px}
.slots{display:flex;gap:6px;flex:1;flex-wrap:wrap;min-height:50px}
.tag{width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.B .tag{color:var(--rd);border-color:var(--pkb)}.F .tag{color:var(--bl);border-color:#93c5fd}
.ch{width:58px;text-align:center;font-size:11px;line-height:1.3}
.ch img{width:58px;height:70px;object-fit:cover;border-radius:6px;display:block}
.pet{flex:none;width:68px;min-height:68px;display:grid;place-items:center}
.pet img{width:68px;height:68px;object-fit:cover;border-radius:10px}
.add{min-width:58px;min-height:50px;border:2px dashed var(--bd);border-radius:8px;background:none;color:var(--mu);padding:4px;display:grid;place-items:center;cursor:pointer;font-size:12px;text-align:center}
[data-a=del],[data-a=set]{cursor:pointer}
.more{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);color:var(--mu)}
.lk{border:0;background:none;padding:0;color:var(--tx)}
.md{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.pg{max-width:860px;margin:0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:6px 0 10px}
th{background:var(--bg);padding:8px;font-size:13px}th,td{border-bottom:1px solid var(--bd);vertical-align:top}td{padding:10px}
td:first-child{width:56%;border-right:1px solid var(--bd)}
.rc{display:flex;gap:10px;margin-bottom:6px}
.eq small{display:block;color:var(--mu);font-size:11px}
.sqs{display:flex;gap:5px;margin-bottom:6px}
.sq{width:42px;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);overflow:hidden}
.sq img{width:100%;height:100%;object-fit:cover;display:block}
textarea,input,select{font:inherit;width:100%;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
textarea{min-height:70px;resize:vertical}select{width:auto}
.tx{white-space:pre-wrap;margin:0}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.li{text-align:center;font-size:11px;word-break:break-all}
.li img{width:100%;height:96px;object-fit:cover;border-radius:8px;cursor:pointer;display:block;margin-bottom:4px}
.li input{font-size:11px;padding:3px 4px}
.li span{display:block}
.chw{position:relative}.chw.hs{margin-right:32px}
.nb,.sb{position:absolute;left:calc(100% - 4px);height:20px;border-radius:10px;padding:0 6px;font:700 10px/20px 'Noto Sans Thai',sans-serif;font-style:normal;white-space:nowrap}
.nb{top:2px;min-width:20px;text-align:center;background:var(--ac);color:var(--acx);font-size:11px}
.sb{top:26px;background:var(--card);border:1px solid var(--bd);color:var(--mu);line-height:18px}
.ctl{display:grid;gap:3px;margin-top:3px;width:58px}.ctl input,.ctl select{width:100%;padding:2px 3px;font-size:11px}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.grid .ch,.grid .ph{width:50px}.grid .ch img{width:50px;height:60px}.grid .ph{height:60px}
.ph{width:58px;height:70px;border:2px dashed var(--bd);border-radius:6px;display:grid;place-items:center;color:var(--mu)}
.es{opacity:.7}
.pcol{flex:none;width:58px;display:flex;flex-direction:column;gap:6px}
.pt{height:50px;border:2px dashed var(--bd);border-radius:10px;display:grid;place-items:center;color:var(--mu);overflow:hidden;background:var(--card)}
.pt:has(img){border-style:solid}.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pcol select{padding:3px;font-size:12px;width:100%}.fmv{text-align:center;color:var(--mu);font-weight:600}
/* popup dialog */
#c{z-index:25;background:#0007;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
#m{z-index:20}
#c[hidden]{display:none}
#c .pg{width:100%;max-width:760px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0006;overflow:hidden;margin:0}
#c .bd{overflow:auto;min-height:0;flex:1}
#c .bd .card{margin-top:0!important;box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
/* softer look */
.card{box-shadow:0 1px 2px #0000000a,0 6px 18px #0000000a;border-radius:18px}
button:hover{background:var(--bg)}button.on:hover{background:var(--ac)}
/* formation layout */
.form{--w:52px;--h:66px;min-height:0;padding:14px 10px;gap:8px;background:linear-gradient(180deg,var(--pk),var(--card) 160%)}
.grid .form{--w:44px;--h:56px;padding:12px 8px}
.form .ch,.form .ph{width:var(--w)}.form .ch img,.form .ph{height:var(--h)}.form .ch img{width:var(--w)}
.rc .ch,.rc .ch img{width:46px}.rc .ch img{height:58px}
.rows{gap:8px}
.row{position:relative;justify-content:center;padding-right:30px}
.row::before{content:'';position:absolute;left:0;right:14px;top:calc(var(--h) * .7);height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ln))}
.B{--ln:#f43f5e44}.F{--ln:#3b82f644}
.row .tag{position:absolute;right:0;top:calc(var(--h) * .7 - 10px);width:26px;height:26px;font-size:12px}
.slots{flex:0 1 auto;justify-content:center;position:relative;z-index:1;min-height:0;gap:8px}
.chw.hs{margin-right:26px}
.nb,.sb{left:calc(100% - 2px)}.sb{font-size:9px;padding:0 4px;top:24px}
.pcol{width:46px}.pt{height:40px;border-radius:9px}
.grid .pcol{width:40px}.grid .pt{height:34px}
.sq{width:34px;height:34px;border-radius:8px}
.ctl{width:var(--w,52px)}
:root{color-scheme:light dark}
.ch span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh{margin:20px 0 10px;font-size:16px}h2.sh{margin:0;font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px;margin-bottom:14px}
.cgrid .form{--w:44px;--h:56px;padding:12px 8px}.cgrid .pcol{width:40px}.cgrid .pt{height:34px}
.sn{color:var(--mu);margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .more{margin-top:10px}
.li input:placeholder-shown{border-color:var(--rd)}
.by{color:var(--tx);font-weight:600;min-width:0}.vts{display:flex;gap:6px}.vb{padding:2px 10px;font-size:13px}.vb.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cc.g1{border-color:#d4af37;box-shadow:0 0 0 2px #d4af3755}.cc.g2{border-color:#b8bec6;box-shadow:0 0 0 2px #b8bec666}.cc.g3{border-color:#cd7f32;box-shadow:0 0 0 2px #cd7f3255}
.cc.rd{border-color:#ef4444;background:color-mix(in srgb,#ef4444 8%,var(--card));box-shadow:0 0 0 2px #ef444455}
.g1 .by{color:#c9a227}.g2 .by{color:#9aa3ad}.g3 .by{color:#cd7f32}.rd .by{color:#ef4444}
.ch[draggable]{cursor:grab}.dragging{opacity:.35}.over{outline:2px dashed var(--bl);outline-offset:3px;border-radius:8px;background:color-mix(in srgb,var(--bl) 14%,transparent)}
.ch{transition:transform .15s}.over{transform:scale(1.06)}
.ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gh{margin:16px 0 8px;font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}.gh small{font-weight:400}
.st{font-style:normal}.rb{background:linear-gradient(90deg,#f43f5e,#f59e0b,#22c55e,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.ub{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ub select{font-size:13px}
.li select{width:100%;font-size:10px;padding:2px;margin-top:3px}
.lg{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.form .ch{position:relative}
.rc{align-items:center}.cw{position:relative}.rc .ch select{width:100%;font-size:10px;padding:2px;margin-top:3px}
.cb{position:absolute;left:-6px;top:-6px;z-index:2;min-width:24px;height:24px;padding:0 3px;border-radius:12px;background:#facc15;color:#111;border:2px solid #111;font:800 11px/20px 'Noto Sans Thai',sans-serif;font-style:normal;text-align:center;pointer-events:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;font-size:14px;padding:5px 14px;background:none}.seg button.on{background:var(--ac);color:var(--acx)}
body.def .pill{background:color-mix(in srgb,var(--bl) 15%,transparent);color:var(--bl)}
.rg{display:flex;gap:16px;flex-wrap:wrap}
.sl em{display:block;text-align:center;font-size:9px;font-style:normal;color:var(--mu);margin-bottom:2px;white-space:nowrap}

/* Supabase sign-in gate */
#authGate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--tx)}
#authGate[hidden]{display:none}
#authGate .auth-card{width:min(100%,420px);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;box-shadow:0 12px 40px #0002}
#authGate h2{margin:0 0 8px;font-size:22px}#authGate p{color:var(--mu)}#authGate label{display:block;margin:12px 0 5px}#authGate input{margin-bottom:8px}#authMsg{min-height:24px;color:var(--rd);white-space:pre-wrap}#authLogout{position:fixed;top:10px;right:10px;z-index:9999;background:var(--card);box-shadow:0 2px 10px #0002}#authLogout[hidden]{display:none}
.chw.hs{margin-right:54px}
.skb{position:absolute;left:calc(100% + 3px);top:0;display:flex;flex-direction:column;gap:3px}
.sk{padding:1px 6px 1px 4px;font-size:10px;line-height:15px;border-radius:9px;min-width:46px;text-align:left;display:flex;align-items:center;gap:3px}
.sk b{background:var(--bd);color:var(--tx);border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;text-align:center;display:inline-block}
.sk.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.sk.on b{background:var(--acx);color:var(--ac)}
.ob{position:absolute;left:calc(100% + 2px);top:0;display:flex;flex-direction:column;gap:3px}
.oe{display:flex;align-items:center;gap:3px;white-space:nowrap}
.nb2{min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--acx);font:700 11px/20px 'Prompt',sans-serif;font-style:normal;text-align:center}
.sb2{height:18px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:700 10px/16px 'Prompt',sans-serif;font-style:normal;padding:0 6px}
.li img{height:auto;aspect-ratio:197/250}.li img.sqi{aspect-ratio:1}
#fab{position:fixed;right:18px;top:max(14px,env(safe-area-inset-top,0px));z-index:24;width:56px;height:56px;padding:0;border-radius:50%;font-size:0;display:grid;place-items:center;background:#3b2417;border:2px solid #c9a36b;box-shadow:0 6px 18px #000a}
#fab::before{content:'\270F\FE0F';font-size:24px;line-height:1}
#fab.on{background:var(--ac);border-color:#fff;box-shadow:0 0 0 4px #f2dcb455,0 6px 18px #000a}
#fmenu{position:fixed;right:18px;top:calc(max(14px,env(safe-area-inset-top,0px)) + 66px);max-height:calc(100vh - 110px);overflow:auto;z-index:24;min-width:220px;background:linear-gradient(180deg,#46291a,#35210f);border:2px solid #7b4f2c;border-radius:16px;padding:8px;box-shadow:0 12px 30px #000b;display:flex;flex-direction:column;gap:2px}
#fmenu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:10px;background:none;padding:9px 12px;font-size:14px}
.mi:hover{background:#ffffff14}.mi span{width:22px;text-align:center}
.mi .sw{margin-left:auto;width:34px;height:18px;border-radius:9px;background:#00000066;border:1px solid var(--bd);position:relative}
.mi .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mu);transition:left .15s}
.mi .sw.on{background:var(--ac)}.mi .sw.on::after{left:18px;background:var(--acx)}
#authLogout{display:none!important}
#app{padding-bottom:84px}
/* bigger character icons */
.form{--w:72px;--h:calc(var(--w) * 1.269)}
.grid .card,.cgrid .card{container-type:inline-size}
.grid .form,.cgrid .form{--w:clamp(44px,calc((100cqw - 220px) / 4),86px);--h:calc(var(--w) * 1.269)}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr))}
.form .ch span{font-size:12px}
.pcol{width:60px}.pt{height:50px}.grid .pcol,.cgrid .pcol{width:58px}.grid .pt,.cgrid .pt{height:46px}
.rc .ch,.rc .ch img{width:60px}.rc .ch img{height:76px}
#m .pg{max-width:1200px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.oe{background:var(--ac);color:var(--acx);border-radius:9px;padding:1px 7px 1px 3px;gap:4px}
.nb2{min-width:15px;height:15px;border-radius:50%;background:var(--acx);color:var(--ac);font:700 10px/15px 'Prompt',sans-serif}
.sb2{height:auto;border:0;background:none;color:inherit;padding:0;font:600 10px/15px 'Prompt',sans-serif}
/* formation v2: bigger slots, Thai front/back tags, pets under the rows */
.form{flex-direction:column;align-items:stretch;gap:6px}
.row{padding-right:54px}
.row .tag{width:auto;min-width:44px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;white-space:nowrap;top:calc(var(--h) * .7 - 9px)}
.row::before{right:22px}
.pcol{flex-direction:row;width:auto;align-self:flex-end;align-items:center;gap:8px}
.pcol select{width:auto}
.pt{width:50px;height:50px}.grid .pcol,.cgrid .pcol{width:auto}.grid .pt,.cgrid .pt{width:44px;height:44px}
.grid .form,.cgrid .form{--w:clamp(48px,calc((100cqw - 140px) / 4),120px);--h:calc(var(--w) * 1.269)}
#m .pg>.card{container-type:inline-size}
#m .pg>.card .form{--w:clamp(72px,calc((100cqw - 160px) / 5),112px);--h:calc(var(--w) * 1.269)}
#c .form{--w:80px;--h:calc(var(--w) * 1.269)}
.grid,.cgrid{align-items:start}
.ob{left:50%;top:4px;transform:translateX(-50%);align-items:center;z-index:3}
/* v3: order badges back to the side, bigger coloured front/back label and pets */
.ob{left:calc(100% + 2px);top:0;transform:none;align-items:flex-start}
.chw.hv{margin-right:46px}
.grid .form,.cgrid .form{--w:clamp(48px,calc((100cqw - 140px - var(--nb,0) * 46px) / 4),120px);--h:calc(var(--w) * 1.269)}

.fmv{display:flex;gap:10px;font-size:18px;font-weight:700;margin-right:6px}
.fmv .f{color:#6fb6ff;text-shadow:0 0 10px #3b82f666}.fmv .b{color:#ff6b6b;text-shadow:0 0 10px #ef444466}
.grid .fmv,.cgrid .fmv{font-size:16px}
.pt{width:64px;height:81px}.grid .pt,.cgrid .pt{width:56px;height:71px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authGate">
  <div class="auth-card">
    <h2>สูตรกาแฟ by เตี่ย</h2>
    <p>เข้าสู่ระบบเพื่อดูและจัดการข้อมูลสูตรกาแฟร่วมกัน</p>
    <form id="authForm">
      <label for="authEmail">อีเมล</label>
      <input id="authEmail" type="email" autocomplete="username" required placeholder="name@example.com">
      <label for="authPassword">รหัสผ่าน</label>
      <input id="authPassword" type="password" autocomplete="current-password" required placeholder="รหัสผ่านบัญชีของคุณ">
      <button id="authSubmit" type="submit" style="width:100%;margin-top:8px">เข้าสู่ระบบ</button>
    </form>
    <div id="authMsg" role="status" aria-live="polite"></div>
    <p style="font-size:12px;margin-bottom:0">บัญชีผู้ใช้ต้องสร้างไว้ใน Supabase Dashboard โดยผู้ดูแลเว็บ</p>
  </div>
</div>
<button id="authLogout" type="button" hidden>ออกจากระบบ</button>
<div id="app"></div>
<div id="m" class="md" hidden></div>
<div id="c" class="md" hidden></div>
<div id="p" class="md" style="z-index:30" hidden></div>
<button id="fab" type="button" aria-label="เมนู" aria-haspopup="menu" aria-expanded="false" title="เมนู"></button>
<div id="fmenu" role="menu" hidden></div>

<script>
const $=s=>document.querySelector(s);
let S={lib:[],teams:[]},E=0,F='ทั้งหมด',cur=null,cb=null;
const slotsOf=(o,pre)=>[...o.f.map((x,i)=>[`${pre}.f.${i}`,x]),...o.b.map((x,i)=>[`${pre}.b.${i}`,x])].filter(s=>s[1]);
const syncRows=o=>{const ids=[...o.f,...o.b].filter(Boolean).map(x=>typeof x=='object'?x.id:x);o.rx=o.rx||{};(o.rows||[]).forEach(r=>{if(r.char)o.rx[r.char]=r});o.rows=ids.map(id=>{const r=o.rx[id]||{char:id,rings:[null,null,null],sets:[null,null,null],note:''};delete o.rx[id];r.stack=r.stack||[null,null,null];return r})};
const FM=['1-4','2-3','3-2','4-1'];
const FMH=v=>{const[f,b]=v.split('-');return `<span class="f">หน้า ${f}</span><span class="b">หลัง ${b}</span>`};
const FML=v=>{const[f,b]=v.split('-');return `หน้า ${f} หลัง ${b}`};
const fit=o=>{const[fr,bk]=o.fm.split('-').map(Number),pad=(a,n)=>Array.from({length:n},(_,i)=>a[i]||null);o.f=pad(o.f,fr);o.b=pad(o.b,bk)};
const norm=d=>{d.lib.forEach(x=>{if(x.cat=='other')x.cat=''});d.teams.forEach(t=>[t.target,...t.counters].forEach(o=>{['b','f'].forEach(k=>o[k]=o[k].map(x=>x&&typeof x!='object'?{id:x,n:'',s:''}:x));if(!FM.includes(o.fm)){const g=o.f.length+'-'+o.b.length;o.fm=FM.includes(g)?g:'3-2'}o.pets=[0,1,2].map(i=>(o.pets||[o.pet])[i]||null);fit(o)}));d.teams.forEach(t=>t.counters.forEach(c=>{if(!c.id)c.id=Math.random().toString(36).slice(2,9);c.by=c.by||'';syncRows(c)}));return d};
try{const d=JSON.parse(localStorage.getItem('k7'));if(d&&d.lib&&d.teams)S=norm(d)}catch(e){}
const save=()=>{clearTimeout(tm);tm=setTimeout(push,700);try{localStorage.setItem('k7',JSON.stringify(S))}catch(e){say('พื้นที่จัดเก็บเต็ม ลองลบรูปที่ไม่ได้ใช้')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const say=t=>{const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:8px 16px;border-radius:999px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),2500)};
const sure=el=>{if(el.dataset.s)return true;const t=el.textContent;el.dataset.s=1;el.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{el.dataset.s='';el.textContent=t},3000);return false};
const L=id=>S.lib.find(x=>x.id==id);
const im=id=>{const x=L(id);return x?`<img src="${x.img}" alt="">`:''};
const nm=id=>(L(id)||{}).name||'';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ref=(o,p)=>{const k=p.split('.'),l=k.pop();return[k.reduce((a,x)=>a[x],o),l]};
const TY={'ถึก':'#6b7280','เวทย์':'#0ea5e9','กายภาพ':'#ef4444','อื่น ๆ':'#8b5cf6'};
const T=()=>S.teams.find(x=>x.id==cur);

const OL={aw:'อเวค',t:'บน',b:'ล่าง'};
const renum=o=>{const es=[];[...o.f,...o.b].forEach(y=>{if(y&&typeof y=='object'&&y.o)for(const k in y.o)es.push([y,k,y.o[k]])});es.sort((a,b)=>a[2]-b[2]).forEach((e,i)=>e[0].o[e[1]]=i+1)};
const ch=(x,dp,ed)=>{
  if(!x||!L(typeof x=='object'?x.id:x))return `<div class="chw ${ed?'hs':''}"><div class="ch es" ${ed?`data-dp="${dp}" data-a="setc" data-p="${dp}"`:''}><div class="ph">${ed?'+':''}</div></div></div>`;
  x=typeof x=='object'?x:{id:x};const od=x.o||{},ks=['aw','t','b'].filter(k=>od[k]).sort((a,b)=>od[a]-od[b]);
  return `<div class="chw ${ed?'hs':ks.length?'hv':''}"><div class="ch" ${ed?`draggable="true" data-dp="${dp}" data-a="setc" data-p="${dp}" title="ลบ"`:''}>${im(x.id)}<span>${esc(nm(x.id))}</span>${x.c?`<i class="cb">C${x.c}</i>`:''}</div>${ed?`<div class="skb">${['aw','t','b'].map(k=>`<button class="sk ${od[k]?'on':''}" data-a="sk" data-k="${k}" data-p="${dp}">${od[k]?`<b>${od[k]}</b>`:''}${OL[k]}</button>`).join('')}</div>`:ks.length?`<div class="ob">${ks.map(k=>`<div class="oe"><i class="nb2">${od[k]}</i><i class="sb2">${OL[k]}</i></div>`).join('')}</div>`:''}${ed?`<div class="ctl"><select data-p="${dp}.c">${[0,1,2,3,4,5,6].map(v=>`<option value="${v||''}" ${(x.c||0)==v?'selected':''}>${v?'C'+v:'C -'}</option>`).join('')}</select></div>`:''}</div>`};
const form=(o,pre,ed)=>{const nb=ed?0:Math.max(0,...['b','f'].map(k=>o[k].filter(x=>x&&typeof x=='object'&&Object.keys(x.o||{}).length).length));
  const row=(k,g)=>`<div class="row ${g}"><div class="slots">${o[k].map((x,i)=>ch(x,`${pre}.${k}.${i}`,ed)).join('')}</div><span class="tag">${g=='B'?'หลัง':'หน้า'}</span></div>`;
  return `<div class="form" style="--nb:${nb}"><div class="rows">${row('b','B')}${row('f','F')}</div><div class="pcol">${ed?`<select data-p="${pre}.fm">${FM.map(v=>`<option value="${v}" ${v==o.fm?'selected':''}>${FML(v)}</option>`).join('')}</select>`:`<small class="fmv">${FMH(o.fm)}</small>`}${o.pets.map((id,i)=>id||ed?`<div class="pt" ${ed?`data-a="set" data-p="${pre}.pets.${i}"`:''}>${id?im(id):'+'}</div>`:'').join('')}</div></div>`};
const render=()=>{
  const list=S.teams.filter(t=>(t.mode||'atk')!=mode?false:F=='ทั้งหมด'||t.type==F);
  $('#app').innerHTML=`<div class="hero"><div class="top hb"><div class="ttl"><h1>สูตรกาแฟ by เตี่ย</h1><div class="seg"><button class="${mode=='atk'?'on':''}" data-a="md" data-id="atk" title="บ้านบุก">⚔️ บ้านบุก</button><button class="${mode=='def'?'on':''}" data-a="md" data-id="def" title="บ้านป้องกัน">🛡️ บ้านป้องกัน</button></div></div></div></div>
  <div class="top" style="padding-bottom:0"><h2 class="sh">${W('meta')}</h2></div>
  <div class="top" style="padding-top:0"><div class="bar"><span style="align-self:center;color:var(--mu)">ประเภททีม</span>${['ทั้งหมด',...Object.keys(TY)].map(x=>`<button class="chip ${F==x?'on':''}" style="--c:${TY[x]||'#111'}" data-a="flt" data-id="${x}">${x}</button>`).join('')}</div><span style="color:var(--mu)">ทั้งหมด ${list.length} รายการ</span></div>
  <div class="grid">${list.map(t=>`<div class="card"><div class="hd"><span class="pill">${W('pill')}</span><span>${t.counters.length} ${W('cn')}</span></div>${form(t.target,'target',0)}<div class="more"><span>${t.type}</span><button class="lk" data-a="open" data-id="${t.id}">ดูเพิ่ม ›</button></div></div>`).join('')||'<p style="color:var(--mu)">ยังไม่มีทีม เปิดโหมดแก้ไข แล้วกด "+ เพิ่มทีม"</p>'}</div>`};

const sq=(id,p)=>`<div class="sq" ${E?`data-a="set" data-p="${p}"`:''}>${im(id)}</div>`;
const trow2=(r,rp,sp,x)=>`<tr><td><div class="rc"><div class="ch"><div class="cw">${im(x.id)}${x.c?`<i class="cb">C${x.c}</i>`:''}</div><span>${esc(nm(x.id))}</span>${E?`<select class="cs" data-p="${sp}.c">${[0,1,2,3,4,5,6].map(v=>`<option value="${v||''}" ${(x.c||0)==v?'selected':''}>${v?'C'+v:'C -'}</option>`).join('')}</select>`:''}</div><div class="eq"><div class="rg"><div><small>แหวน</small><div class="sqs">${[0,1,2].map(k=>sq(r.rings[k],`${rp}.rings.${k}`)).join('')}</div></div><div><small>ซ้อน</small><div class="sqs">${['ดีสุด','ดี','ใช้ได้'].map((l,k)=>`<div class="sl"><em>${l}</em>${sq(r.stack[k],`${rp}.stack.${k}`)}</div>`).join('')}</div></div></div><small>เซ็ตไอเทม</small><div class="sqs">${[0,1,2].map(k=>sq(r.sets[k],`${rp}.sets.${k}`)).join('')}</div></div></div></td><td>${E?`<textarea data-p="${rp}.note" placeholder="อธิบายการสวมใส่ เช่น แหวนอะไร สถานะที่ต้องการ">${esc(r.note)}</textarea>`:`<p class="tx">${esc(r.note)}</p>`}</td></tr>`;
const rowsHtml=(c,p)=>{syncRows(c);return slotsOf(c,p).map(([sp,x],j)=>trow2(c.rows[j],`${p}.rows.${j}`,sp,x)).join('')};
const cnt=(c,i)=>{const p=`counters.${i}`;return `<div class="card" style="margin-top:16px"><div class="hd"><b style="color:var(--tx)">${W('c1')} ${i+1}</b>${E?`<button class="dg" data-a="del" data-c="1" data-p="${p}">${W('dc')}</button>`:''}</div>${form(c,p,E)}<h4>คำแนะนำ / วิธีการเล่น</h4>${E?`<textarea data-p="${p}.tip" placeholder="วิธีเล่น ข้อควรระวัง">${esc(c.tip)}</textarea>`:`<p class="tx">${esc(c.tip)}</p>`}<h4>ตัวละคร</h4><table><tr><th>ตัวละคร</th><th>รายละเอียด</th></tr>${rowsHtml(c,p)}</table></div>`};
let ci=null;
const renderD=()=>{const t=T();$('#m').hidden=!t;if(!t){renderC();return}if(ci!=null&&ci>=t.counters.length)ci=null;
  $('#m').innerHTML=`<div class="pg"><div class="hd"><button data-a="back">‹ กลับ</button>${E?`<span><select data-p="type">${Object.keys(TY).map(x=>`<option ${x==t.type?'selected':''}>${x}</option>`).join('')}</select> <button class="dg" data-a="delt">ลบทีม</button></span>`:`<span>${t.type}</span>`}</div><div class="card"><div class="hd"><span class="pill">${W('meta')}</span></div>${form(t.target,'target',E)}</div><h3 class="sh">${W('cl')} (${t.counters.length})</h3><div class="cgrid">${ord(t).map(([c,i])=>`<div class="card cc ${rk(t,c)}"><div class="hd"><span class="by">${rkm(t,c)} ${esc(c.by)||'ไม่ระบุชื่อ'}</span>${votes(t,c)}</div><div hidden><b>ทีมแก้ ${i+1}</b></div>${form(c,`counters.${i}`,0)}<p class="tx sn">${esc(c.tip)}</p><div class="more"><span></span><button class="lk" data-a="oc" data-id="${i}">ดูรายละเอียด ›</button></div></div>`).join('')||'<p class="tx" style="color:var(--mu)">'+W('none')+'</p>'}</div>${E?`<button data-a="addc">+ ${W('add')}</button>`:''}</div>`;renderC()};
const renderC=()=>{const t=T(),c=t&&ci!=null&&t.counters[ci];$('#c').hidden=!c;if(!c)return;
  $('#c').innerHTML=`<div class="pg"><div class="hd"><span class="by">${E?`<input data-p="counters.${ci}.by" value="${esc(c.by)}" placeholder="ชื่อผู้จัดทีม (เครดิต)" style="width:190px">`:`${rkm(t,c)} ${esc(c.by)||'ไม่ระบุชื่อ'}`}</span>${votes(t,c)}<button data-a="cx">✕ ปิด</button></div><div class="bd">${cnt(c,ci)}</div></div>`};
const CARD=197/250;
const comp=(f,cat)=>new Promise(r=>{const i=new Image;i.onload=()=>{const ar=(cat=='ring'||cat=='set')?1:CARD;let sw=i.width,sh=i.height,sx=0,sy=0;if(sw/sh>ar){const nw=sh*ar;sx=(sw-nw)/2;sw=nw}else{const nh=sw/ar;sy=(sh-nh)/2;sh=nh}const tw=Math.round(Math.min(sw,160)),th=Math.round(tw/ar),c=document.createElement('canvas');c.width=tw;c.height=th;c.getContext('2d').drawImage(i,sx,sy,sw,sh,0,0,tw,th);r(c.toDataURL('image/webp',.88))};i.src=URL.createObjectURL(f)});
const CATS=[['o7k','O7K','r'],['aw_top','อเวค ทองบน','p'],['aw_bot','อเวค ทองล่าง','p'],['aw_pur','อเวค ม่วง','p'],['top','ทองบน','y'],['bot','ทองล่าง','y'],['pur','ม่วง','y'],['pet','สัตว์เลี้ยง','d'],['ring','แหวน','g'],['set','เซตไอเทม','s']];
const NC=['none','ยังไม่จัดหมวด','o'];
const ico=k=>({r:'<i class="st rb">★</i>',p:'<i class="st" style="color:#8b5cf6">★</i>',y:'<i class="st" style="color:#eab308">★</i>',d:'🐶',g:'💍',s:'📦',o:'📦'})[k];
let lf='all',lh='all',upc='top';
const ck=x=>x.cat||'none';
const tile=x=>`<div class="li"><img class="${x.cat=='ring'||x.cat=='set'?'sqi':''}" src="${x.img}" alt="" ${cb?`data-a="pk" data-id="${x.id}"`:''}><input value="${esc(x.name)}" data-nm="${x.id}" placeholder="ตั้งชื่อรูป"><select data-cat="${x.id}">${[['','—'],...CATS].map(c=>`<option value="${c[0]}" ${(x.cat||'')==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>${cb?'':`<button class="dg" data-a="rml" data-id="${x.id}">ลบ</button>`}</div>`;
const lg=()=>{const q=($('#q').value||'').toLowerCase(),all=S.lib.filter(x=>(x.name||'').toLowerCase().includes(q)),n=k=>all.filter(x=>ck(x)==k).length,cs=[...CATS,NC].filter(c=>c[0]!='none'||n('none')>0);
  $('#cc').innerHTML=`<button class="chip ${lf=='all'?'on':''}" style="--c:#111" data-a="lf" data-id="all">ทั้งหมด ${all.length}</button>`+cs.map(c=>`<button class="chip ${lf==c[0]?'on':''}" style="--c:#6b7280" data-a="lf" data-id="${c[0]}">${ico(c[2])} ${c[1]} ${n(c[0])}</button>`).join('');
  $('#lg').innerHTML=cs.filter(c=>lf=='all'||lf==c[0]).map(c=>{const it=all.filter(x=>ck(x)==c[0]).sort((a,b)=>(!b.name-!a.name)||(b.ts||0)-(a.ts||0));return it.length?`<h4 class="gh">${ico(c[2])} ${c[1]} <small>${it.length}</small></h4><div class="lg">${it.map(tile).join('')}</div>`:''}).join('')||'<p style="color:var(--mu)">ไม่พบรูป กดอัปโหลดรูปได้เลย</p>'};
const lib=c=>{cb=c;lf=c?lh:'all';if(lf!='all'&&!S.lib.some(x=>ck(x)==lf))lf='all';if(c&&lh!='all')upc=lh;const p=$('#p');p.hidden=false;p.innerHTML=`<div class="pg"><div class="hd"><b style="color:var(--tx)">${c?'เลือกรูป':'คลังรูป'}</b><span class="ub">หมวดของรูปที่อัปโหลด <select data-upc="1">${CATS.map(k=>`<option value="${k[0]}" ${k[0]==upc?'selected':''}>${k[1]}</option>`).join('')}</select><label class="btn">+ อัปโหลดรูป<input id="fi" type="file" accept="image/*" multiple hidden></label> <button data-a="x">ปิด</button></span></div><input id="q" placeholder="ค้นหาชื่อ"><div id="cc" class="bar" style="margin:10px 0"></div><div id="lg"></div></div>`;lg();if(c)$('#q').focus()};
const bk=()=>{cb=null;const p=$('#p');p.hidden=false;p.innerHTML=`<div class="pg"><div class="hd"><b style="color:var(--tx)">สำรอง / นำเข้าข้อมูล</b><button data-a="x">ปิด</button></div><p class="tx">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ คัดลอกข้อความด้านล่างไปเก็บไว้ หรือวางข้อมูลเก่าแล้วกดนำเข้า</p><textarea id="bt" rows="8">${esc(JSON.stringify(S))}</textarea><p><button data-a="cp">คัดลอก</button> <button data-a="imp">นำเข้า (แทนที่ข้อมูลเดิม)</button></p></div>`};

document.addEventListener('click',e=>{
  {const fb=e.target.closest('#fab');if(fb){const m=$('#fmenu');if(m.hidden){fmenu();m.hidden=false;fb.setAttribute('aria-expanded','true')}else closeMenu();return}if(!e.target.closest('#fmenu'))closeMenu()}
  if(e.target.id=='c'){ci=null;renderD();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.closest('#fmenu')&&el.dataset.a!='ed')closeMenu();
  const a=el.dataset.a,p=el.dataset.p,id=el.dataset.id,t=T(),done=()=>{if(t){t.counters.forEach(syncRows);[t.target,...t.counters].forEach(renum)}save();renderD()};
  lh=/\.pets\./.test(p||'')?'pet':/\.(rings|stack)\./.test(p||'')?'ring':/\.sets\./.test(p||'')?'set':'all';
  if(a=='ed'){if(!canW){say('บัญชีนี้ไม่มีสิทธิ์แก้ไข');return}E=!E;render();renderD();fmenu()}
  else if(a=='flt'){F=id;render()}
  else if(a=='tab'){ci=+id;renderD()}
  else if(a=='oc'){ci=+id;renderC()}
  else if(a=='cx'){ci=null;renderD()}
  else if(a=='vt')vote(el.dataset.k,el.dataset.v)
  else if(a=='lo'){const b=$('#authLogout');if(b)b.click()}
